<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthAI | Login</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Icons & Libraries -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0052cc;
            --primary-hover: #0747a6;
            --primary-light: #deebff;
            --bg-page: #f4f5f7;
            --text-main: #172b4d;
            --text-sub: #5e6c84;
            --border: #dfe1e6;
            --shadow-card: 0 8px 16px -4px rgba(9, 30, 66, 0.12), 0 0 1px rgba(9, 30, 66, 0.2);
            --radius: 12px;
            --font-family: 'Outfit', sans-serif;
            --transition: all 0.25s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-page);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: radial-gradient(circle at top right, var(--primary-light) 0%, transparent 40%),
                              radial-gradient(circle at bottom left, #e3fcef 0%, transparent 40%);
        }

        .login-container {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 40px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-card);
            text-align: center;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: 800;
            font-size: 2rem;
            color: var(--text-main);
            margin-bottom: 10px;
        }

        .logo i {
            color: var(--primary);
        }

        .login-subtitle {
            color: var(--text-sub);
            font-size: 1rem;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            font-family: var(--font-family);
            outline: none;
            transition: var(--transition);
        }

        .input-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 82, 204, 0.1);
        }

        .login-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font-family);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }

        .login-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 82, 204, 0.2);
        }

        .login-footer {
            margin-top: 25px;
            font-size: 0.85rem;
            color: var(--text-sub);
            border-top: 1px solid var(--border);
            padding-top: 20px;
        }

        #error-msg {
            color: #ff5630;
            font-size: 0.9rem;
            margin-bottom: 15px;
            display: none;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo">
            <i class="fa-solid fa-square-plus"></i>
            <span>HealthAI</span>
        </div>
        <p class="login-subtitle">Welcome back! Please login to continue.</p>

        <form id="login-form">
            <div class="input-group">
                <label for="username">Your Name</label>
                <input type="text" id="username" placeholder="Enter your full name" required autocomplete="off">
            </div>
            
            <p id="error-msg">Please enter your name to continue.</p>

            <button type="submit" class="login-btn">
                Continue to Dashboard <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <div class="login-footer">
            <i class="fa-solid fa-shield-halved"></i> Secure HIPAA Compliant Access
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // If already logged in, redirect to index
            if (localStorage.getItem('ai_health_user')) {
                window.location.href = 'index.html';
                return;
            }

            const loginForm = document.getElementById('login-form');
            const usernameInput = document.getElementById('username');
            const errorMsg = document.getElementById('error-msg');

            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();
                
                const username = usernameInput.value.trim();
                if (username.length < 2) {
                    errorMsg.textContent = "Please enter a valid name (at least 2 characters).";
                    errorMsg.style.display = 'block';
                    return;
                }

                // Save to local storage
                localStorage.setItem('ai_health_user', username);
                
                // Add a small delay for animation effect
                const btn = loginForm.querySelector('.login-btn');
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Logging in...';
                
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 600);
            });
        });
    </script>
</body>
</html>
